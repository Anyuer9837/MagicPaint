<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>画板</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#f7f8fb;font-family:Arial;width:100%;display:flex;justify-content:center}
  .container{display:flex;flex-direction:column;height:100vh;width:100%;max-width:420px}
  .toolbar{background:#fff;padding:12px;display:flex;flex-direction:column;gap:12px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
  .row{display:flex;align-items:center;gap:8px}
  .label{font-size:14px;color:#333;min-width:60px}
  .palette{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .color-btn{width:100%;height:60px;border:2px solid transparent;border-radius:8px;cursor:pointer;transition:.2s}
  .color-btn.active{border-color:#2b7af4}
  .brush-slider{flex:1}
  .size-display{min-width:40px;text-align:right;font-size:14px}
  .button-row{display:flex;gap:8px}
  .btn{flex:1;padding:12px;border:1px solid #ddd;border-radius:8px;cursor:pointer;background:transparent;font-size:14px;transition:.2s}
  .btn:hover{background:#f0f0f0}
  .btn.primary{background:#2b7af4;color:#fff;border-color:#2b7af4}
  .btn.primary:hover{background:#1e5fa3}
  .canvas-container{flex:1;display:flex;justify-content:center;align-items:center;padding:8px;overflow:hidden}
  canvas{width:100%;height:100%;background:#fff;border-radius:6px;box-shadow:0 4px 18px rgba(0,0,0,.08);cursor:crosshair;touch-action:none;display:block}
</style>
</head>
<body>

<div class="container">
  <div class="toolbar">
    <div class="row">
      <span class="label">颜色</span>
    </div>
    <div class="palette">
      <button class="color-btn" data-color="#ff0000" style="background:#ff0000;border-radius:8px" title="红色"></button>
      <button class="color-btn" data-color="#0000ff" style="background:#0000ff;border-radius:8px" title="蓝色"></button>
      <button class="color-btn" data-color="#00aa00" style="background:#00aa00;border-radius:8px" title="绿色"></button>
      <button class="color-btn active" data-color="#000000" style="background:#000000;border-radius:8px" title="黑色"></button>
    </div>

    <div style="display:grid;grid-template-columns:60px 1fr 60px;align-items:center">
      <span class="label" style="min-width:auto">笔刷</span>
      <span class="size-display" style="min-width:auto;text-align:center"><span id="sizeNum">4</span>px</span>
      <span></span>
    </div>
    <input type="range" id="brushSize" class="brush-slider" min="1" max="60" value="4">

    <div class="button-row">
      <button class="btn" id="undoBtn">撤销</button>
      <button class="btn" id="clearBtn">清除</button>
      <button class="btn" id="saveBtn">保存 PNG</button>
    </div>
  </div>

  <div class="canvas-container">
    <canvas id="canvas"></canvas>
  </div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

// 状态
let state = {
  color: '#000000',
  size: 4,
  drawing: false,
  history: [],
  gridMode: false
};

// 初始化canvas
function initCanvas() {
  const rect = canvas.getBoundingClientRect();
  const ratio = window.devicePixelRatio || 1;
  
  canvas.width = rect.width * ratio;
  canvas.height = rect.height * ratio;
  canvas.style.width = rect.width + 'px';
  canvas.style.height = rect.height + 'px';
  
  ctx.scale(ratio, ratio);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, rect.width, rect.height);
}

// 获取指针位置
function getPointerPos(e) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: e.clientX - rect.left,
    y: e.clientY - rect.top
  };
}

// 保存历史
function pushHistory() {
  try {
    if (state.history.length >= 30) state.history.shift();
    state.history.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
    document.getElementById('undoBtn').disabled = false;
  } catch (e) {
    console.warn("Canvas已被污染，无法读取像素数据，撤销功能将暂时不可用。", e);
    document.getElementById('undoBtn').disabled = true;
  }
}

// 撤销
function undo() {
  if (state.history.length === 0) return;
  const img = state.history.pop();
  ctx.putImageData(img, 0, 0);
  if (state.history.length === 0) document.getElementById('undoBtn').disabled = true;
}

// 获取象限
function getQuadrant(x, y) {
  const w = canvas.getBoundingClientRect().width;
  const h = canvas.getBoundingClientRect().height;
  const midX = w / 2;
  const midY = h / 2;
  if (x < midX) return y < midY ? 1 : 3;
  return y < midY ? 2 : 4;
}

// 加载PNG图片到画布（修改部分）
function loadImage(num) {
  const img = new Image();
  img.crossOrigin = "anonymous";
  img.src = `${num}.png`;
  
  img.onload = () => {
    state.history = [];
    document.getElementById('undoBtn').disabled = true;
    
    const rect = canvas.getBoundingClientRect();
    
    // 1. 先将画布填充为纯白底，并存入历史记录，作为“白板”状态
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, rect.width, rect.height);
    pushHistory(); // 此时 history = [纯白板]，撤销按钮被启用
    
    // 2. 计算缩放并绘制图片（直接盖在纯白底色上，避免了透明度穿透问题）
    const scale = Math.min(rect.width / img.width, rect.height / img.height);
    const scaledWidth = img.width * scale;
    const scaledHeight = img.height * scale;
    const x = (rect.width - scaledWidth) / 2;
    const y = (rect.height - scaledHeight) / 2;
    
    ctx.drawImage(img, x, y, scaledWidth, scaledHeight);
    
    // 注意：绘制完图片后，不进行 pushHistory()。
    // 这时画布上呈现的是带有图片的画面，而撤销栈的栈顶是刚才保存的纯白板。
  };
  
  img.onerror = () => {
    console.error(`无法加载图片: ${num}.png`);
    alert(`加载图片失败: ${num}.png`);
  };
}

// 绘画事件
canvas.addEventListener('pointerdown', (e) => {
  if (state.gridMode) {
    const pos = getPointerPos(e);
    const quad = getQuadrant(pos.x, pos.y);
    loadImage(quad);
    state.gridMode = false;
    return;
  }
  
  state.drawing = true;
  pushHistory();
  const pos = getPointerPos(e);
  
  ctx.strokeStyle = state.color;
  ctx.lineWidth = state.size;
  ctx.beginPath();
  ctx.moveTo(pos.x, pos.y);
});

canvas.addEventListener('pointermove', (e) => {
  if (!state.drawing || state.gridMode) return;
  const pos = getPointerPos(e);
  ctx.lineTo(pos.x, pos.y);
  ctx.stroke();
});

canvas.addEventListener('pointerup', () => {
  state.drawing = false;
  ctx.beginPath();
});

canvas.addEventListener('pointercancel', () => {
  state.drawing = false;
  ctx.beginPath();
});

// 颜色选择
document.querySelectorAll('.color-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    state.color = btn.dataset.color;
  });
});

// 笔刷大小
document.getElementById('brushSize').addEventListener('input', (e) => {
  state.size = e.target.value;
  document.getElementById('sizeNum').textContent = state.size;
});

document.getElementById('undoBtn').addEventListener('click', undo);

// 核心改动 1：通过原 class 类选择器绑定点击事件，进入网格模式
document.querySelector('.size-display').addEventListener('click', () => {
  state.gridMode = true;
  state.history = [];
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  document.getElementById('undoBtn').disabled = true;
});

// 修改部分：点击清除按钮后清空历史记录并禁用撤销按钮
document.getElementById('clearBtn').addEventListener('click', () => {
  state.history = []; // 清空历史记录
  document.getElementById('undoBtn').disabled = true; // 禁用撤销按钮
  ctx.clearRect(0, 0, canvas.width, canvas.height); // 清除画布
});

// 保存按钮
document.getElementById('saveBtn').addEventListener('click', () => {
  try {
    const link = document.createElement('a');
    link.download = 'drawing.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  } catch (e) {
    alert("保存失败：由于加载了本地文件，画布已被浏览器安全机制保护。请在本地搭建 Web 服务器（如 VSCode 的 Live Server 插件）来运行此页面，方可使用撤销与保存功能。");
  }
});

// 初始化
window.addEventListener('resize', initCanvas);
initCanvas();
pushHistory();
document.getElementById('undoBtn').disabled = true;
</script>

</body>
</html>
